<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="monospace" font-size="14">
  <rect width="560" height="380" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold">ex2  (- (pow x 4) 1)  =  x^4 - 1</text>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="280" y1="80" x2="160" y2="140"/>
    <line x1="280" y1="80" x2="400" y2="140"/>
    <line x1="160" y1="190" x2="100" y2="250"/>
    <line x1="160" y1="190" x2="235" y2="250"/>
  </g>
  <g fill="#eef4ff" stroke="#333333" stroke-width="1.5">
    <rect x="230" y="44" width="100" height="36" rx="4"/>
    <rect x="110" y="140" width="100" height="36" rx="4"/>
    <rect x="350" y="140" width="100" height="36" rx="4"/>
    <rect x="40" y="250" width="120" height="36" rx="4"/>
    <rect x="180" y="250" width="110" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="280" y="67">SUB</text>
    <text x="160" y="163">POW</text>
    <text x="400" y="163">PUSH_INT 1</text>
    <text x="100" y="273">PUSH_SYMBOL x</text>
    <text x="235" y="273">PUSH_INT 4</text>
  </g>
  <text x="280" y="318" text-anchor="middle">quarticCert: x^4 - 1 = (x^2 + 1) * (x^2 - 1) + 0</text>
  <text x="280" y="340" text-anchor="middle">generator x^2 - 1, quotient x^2 + 1, remainder 0</text>
  <text x="280" y="362" text-anchor="middle">vanishes when x^2 - 1 = 0</text>
</svg>
