<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
<text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif">Admission gate — Admit(M) = G_grammar ∧ G_semantics ∧ G_proof ∧ G_behavior ∧ G_binary</text>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e6da4"/></marker>
</defs>
<g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1a1a">
<rect x="40" y="60" width="380" height="44" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="60" y="88" font-weight="bold">G_grammar</text><text x="200" y="88">vanish XML validates against the DTD structure</text>
<rect x="40" y="120" width="380" height="44" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="60" y="148" font-weight="bold">G_semantics</text><text x="200" y="148">OpenMath round-trip preserves every expression</text>
<rect x="40" y="180" width="380" height="44" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="60" y="208" font-weight="bold">G_proof</text><text x="200" y="208">lake build passes; Lean certificate check passes</text>
<rect x="40" y="240" width="380" height="44" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="60" y="268" font-weight="bold">G_behavior</text><text x="200" y="268">all Gherkin scenarios pass</text>
<rect x="40" y="300" width="380" height="44" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="60" y="328" font-weight="bold">G_binary</text><text x="200" y="328">loader round-trip reconstructs the identical AST</text>
<rect x="620" y="172" width="200" height="60" rx="4" fill="#2e6da4"/>
<text x="720" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ADMIT</text>
<text x="720" y="218" text-anchor="middle" font-size="12" fill="#ffffff">only when all five pass</text>
<line x1="420" y1="82" x2="620" y2="182" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="420" y1="142" x2="620" y2="192" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="420" y1="202" x2="620" y2="202" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="420" y1="262" x2="620" y2="212" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="420" y1="322" x2="620" y2="222" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<text x="440" y="380" text-anchor="middle" font-size="11" fill="#555555">Each G is a real check in tests/run_pipeline.sh; a failed G prints DENY and exits non-zero.</text>
</g>
</svg>
