<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
<text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif">Compiler correspondence — two lowerings, one instruction stream</text>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e6da4"/></marker>
</defs>
<g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1a1a">
<rect x="280" y="52" width="320" height="36" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="440" y="75" text-anchor="middle">Expression e : Expr (lit, var, add, sub, neg, mul, pow)</text>
<rect x="60" y="130" width="300" height="76" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="210" y="156" text-anchor="middle" font-weight="bold">XSLT lowering</text>
<text x="210" y="178" text-anchor="middle">xslt/lower.xsl, run by libxslt</text>
<text x="210" y="196" text-anchor="middle">via tests/xslt.py</text>
<rect x="520" y="130" width="300" height="76" rx="4" fill="#eaf2f8" stroke="#2e6da4"/>
<text x="670" y="156" text-anchor="middle" font-weight="bold">Lean compile</text>
<text x="670" y="178" text-anchor="middle">Vanish.compile, lean/Vanish/Pipeline.lean</text>
<text x="670" y="196" text-anchor="middle">formalized lowering: Vanish.lowerXml</text>
<line x1="360" y1="88" x2="210" y2="130" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="520" y1="88" x2="670" y2="130" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="240" width="320" height="36" rx="4" fill="#2e6da4"/>
<text x="440" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">C_XSLT(e) = C_Lean(e)</text>
<line x1="210" y1="206" x2="360" y2="240" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<line x1="670" y1="206" x2="520" y2="240" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<text x="440" y="306" text-anchor="middle">Universal theorem: Vanish.correspondence, by structural induction over Expr.</text>
<text x="440" y="328" text-anchor="middle">XSLT-side evidence: exhaustive corpus, 14,164 expressions, depth ≤ 2 — differential testing, not the proof.</text>
<text x="440" y="350" text-anchor="middle">Semantic contract: ⟦C_Lean(e)⟧ = ⟦e⟧ (Vanish.semantic_preservation).</text>
<text x="440" y="372" text-anchor="middle" font-size="11" fill="#555555">Trusted boundary: the XSLT engine executing the stylesheet as written, and the XML parser.</text>
</g>
</svg>
