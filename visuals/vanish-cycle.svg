<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="monospace" font-size="14">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">vanishing calculator: VISIBLE / HIDDEN cycle</text>
  <g stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L9,3 L0,6 Z" fill="#333333"/>
      </marker>
    </defs>
    <line x1="400" y1="80" x2="480" y2="160"/>
    <line x1="480" y1="230" x2="400" y2="300"/>
    <line x1="240" y1="300" x2="160" y2="230"/>
    <line x1="160" y1="160" x2="240" y2="80"/>
  </g>
  <g fill="#eef4ff" stroke="#333333" stroke-width="1.5">
    <rect x="240" y="44" width="160" height="36" rx="4"/>
    <rect x="470" y="160" width="160" height="36" rx="4"/>
    <rect x="240" y="300" width="160" height="36" rx="4"/>
    <rect x="10" y="160" width="160" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="320" y="67">VISIBLE</text>
    <text x="550" y="183">COMPUTE</text>
    <text x="320" y="323">HIDDEN</text>
    <text x="90" y="183">RESTORE</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333333">
    <text x="320" y="102">engine in file</text>
    <text x="550" y="216">Fibonacci(10), Primes(30), Factorial(5)</text>
    <text x="320" y="358">engine is base64 in *hidden-payload*</text>
    <text x="90" y="216">decode payload, restore engine</text>
    <text x="470" y="130">run 1: compute and hide</text>
    <text x="170" y="130">run 2: decode and restore</text>
  </g>
</svg>
